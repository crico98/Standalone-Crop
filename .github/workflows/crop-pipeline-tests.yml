name: Crop pipeline tests

on:
  push:
    branches:
      - main
      - experiment/orientation-aware-top-isometric
      - feature/view-specific-crop-pipeline
      - prototype/isolated-view-upload-dropzones-do-not-integrate
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install Pillow==13.0.0
      - name: Run crop pipeline unit tests
        run: python -m unittest discover -s tests -v
